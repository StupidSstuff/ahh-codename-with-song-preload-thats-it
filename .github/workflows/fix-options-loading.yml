name: Fix Options Song Return

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch PlayState loading condition
        shell: python
        run: |
          from pathlib import Path

          p = Path('source/funkin/game/PlayState.hx')
          text = p.read_text(encoding='utf-8')

          old = '''\t\tif (!skipLoadingStateOnce) {\n\t\t\tFlxG.switchState(new PlayStateLoadingState());\n\t\t\treturn;\n\t\t}\n\n\t\tskipLoadingStateOnce = false;'''
          new = '''\t\tif (pendingLoadingState && !skipLoadingStateOnce) {\n\t\t\tFlxG.switchState(new PlayStateLoadingState());\n\t\t\treturn;\n\t\t}\n\n\t\tskipLoadingStateOnce = false;'''

          if old not in text:
              raise SystemExit('Expected PlayState loading hook was not found')

          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove helper workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-options-loading.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/funkin/game/PlayState.hx .github/workflows/fix-options-loading.yml
          git commit -m 'Only preload when song entry is pending'
          git push
