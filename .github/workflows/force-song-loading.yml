name: Apply always-on song loading hook

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          playstate = Path('source/funkin/game/PlayState.hx')
          text = playstate.read_text(encoding='utf-8')

          old = '''\tpublic static var pendingLoadingState:Bool = false;\n\n\t/**\n\t * Script Pack of all the scripts being ran.\n\t */'''
          new = '''\tpublic static var pendingLoadingState:Bool = false;\n\n\t/**\n\t * Set by PlayStateLoadingState immediately before creating the real gameplay state.\n\t * This prevents the always-on loading hook below from recursively reopening the loader.\n\t */\n\tpublic static var skipLoadingStateOnce:Bool = false;\n\n\t/**\n\t * Script Pack of all the scripts being ran.\n\t */'''
          if old not in text:
              raise SystemExit('static insertion point not found')
          text = text.replace(old, new, 1)

          old = '''\t@:dox(hide) override public function create()\n\t{\n\t\tif (pendingLoadingState) {\n\t\t\tpendingLoadingState = false;\n\t\t\tFlxG.switchState(new PlayStateLoadingState());\n\t\t\treturn;\n\t\t}\n\n\t\tNote.__customNoteTypeExists = [];'''
          new = '''\t@:dox(hide) override public function create()\n\t{\n\t\tif (!skipLoadingStateOnce) {\n\t\t\tFlxG.switchState(new PlayStateLoadingState());\n\t\t\treturn;\n\t\t}\n\n\t\tskipLoadingStateOnce = false;\n\t\tpendingLoadingState = false;\n\n\t\tNote.__customNoteTypeExists = [];'''
          if old not in text:
              raise SystemExit('create insertion point not found')
          text = text.replace(old, new, 1)

          playstate.write_text(text, encoding='utf-8')

          loader = Path('source/funkin/game/PlayStateLoadingState.hx')
          text = loader.read_text(encoding='utf-8')

          old = '''\t\tPlayState.pendingLoadingState = false;\n\n\t\tif (__skipTransition) {'''
          new = '''\t\tPlayState.pendingLoadingState = false;\n\t\tPlayState.skipLoadingStateOnce = true;\n\n\t\tif (__skipTransition) {'''
          if old not in text:
              raise SystemExit('loader insertion point not found')
          text = text.replace(old, new, 1)

          loader.write_text(text, encoding='utf-8')

      - name: Commit source changes and remove helper
        run: |
          rm .github/workflows/force-song-loading.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/funkin/game/PlayState.hx source/funkin/game/PlayStateLoadingState.hx .github/workflows/force-song-loading.yml
          git commit -m 'Always route song entry through loading state'
          git push
