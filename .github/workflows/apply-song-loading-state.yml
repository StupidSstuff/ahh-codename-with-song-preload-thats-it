name: Apply song loading state integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration
        shell: python
        run: |
          from pathlib import Path

          changes = {
              "source/funkin/menus/FreeplayState.hx": [
                  (
                      'import funkin.game.HealthIcon;\n',
                      'import funkin.game.HealthIcon;\nimport funkin.game.PlayStateLoadingState;\n',
                  ),
                  (
                      'PlayState.loadSong(event.song, event.difficulty, event.variant, event.opponentMode, event.coopMode);\n\t\tFlxG.switchState(new PlayState());',
                      'PlayState.loadSong(event.song, event.difficulty, event.variant, event.opponentMode, event.coopMode);\n\t\tFlxG.switchState(new PlayStateLoadingState());',
                  ),
              ],
              "source/funkin/menus/StoryMenuState.hx": [
                  (
                      'import funkin.backend.FunkinText;\n',
                      'import funkin.backend.FunkinText;\nimport funkin.game.PlayStateLoadingState;\n',
                  ),
                  (
                      'FlxG.switchState(new PlayState());',
                      'FlxG.switchState(new PlayStateLoadingState());',
                  ),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text was not found in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No changes made to {filename}')
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-song-loading-state.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/funkin/menus/FreeplayState.hx source/funkin/menus/StoryMenuState.hx .github/workflows/apply-song-loading-state.yml
          git commit -m 'Route song entry through PlayStateLoadingState'
          git push